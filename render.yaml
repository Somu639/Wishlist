services:
  - type: web
    name: styleai-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SQLITE_PATH
        value: /tmp/wishlist.db
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.6-27b
      - key: VTON_PROVIDER
        value: none
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
